name: 商品情報をDMM APIから取得

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'DMM商品ID（例: d_734450）'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: DMM APIから商品情報を取得してJSONを作成
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID_API }}
          REVENUE_AFFILIATE_ID: json511jp-001
          CONTENT_ID: ${{ github.event.inputs.content_id }}
        run: node fetch-product.js

      - name: JSONファイルをコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/
          git diff --staged --quiet || git commit -m "Add product: ${{ github.event.inputs.content_id }}"
          git push

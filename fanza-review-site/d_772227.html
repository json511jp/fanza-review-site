  <script>
    var imgs = ["https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-001.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-002.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-003.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-004.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-005.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-006.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-007.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-008.jpg","https://doujin-assets.dmm.co.jp/digital/comic/d_772227/d_772227jp-009.jpg"];
    var current = 0;
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lbImg');
    var lbCounter = document.getElementById('lbCounter');

    function openLightbox(index) {
      current = index;
      updateLightbox();
      lb.classList.add('active');
    }
    function updateLightbox() {
      lbImg.src = imgs[current];
      lbCounter.textContent = (current + 1) + ' / ' + imgs.length;
    }
    document.getElementById('lbClose').addEventListener('click', function(){ lb.classList.remove('active'); });
    document.getElementById('lbPrev').addEventListener('click', function(){
      current = (current - 1 + imgs.length) % imgs.length;
      updateLightbox();
    });
    document.getElementById('lbNext').addEventListener('click', function(){
      current = (current + 1) % imgs.length;
      updateLightbox();
    });
    lb.addEventListener('click', function(e){
      if (e.target === lb) lb.classList.remove('active');
    });
    document.addEventListener('keydown', function(e){
      if (!lb.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') { current = (current - 1 + imgs.length) % imgs.length; updateLightbox(); }
      if (e.key === 'ArrowRight') { current = (current + 1) % imgs.length; updateLightbox(); }
      if (e.key === 'Escape') lb.classList.remove('active');
    });
  </script>
